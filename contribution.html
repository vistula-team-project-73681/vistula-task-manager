<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contribution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-panel" style="text-align: center;">
        <h1>Team Contribution</h1>
        <button id="load-contributor">Show Contributor</button>
        <div id="contributor-student-id" style="margin: 20px 0; font-weight: bold;"></div>
        <a href="index.html" style="color: #8bb4f7; text-decoration: none;">Back to Task Manager</a>
    </div>

    <script>
        document.getElementById('load-contributor').addEventListener('click', async () => {
            try {
                const response = await fetch('contribution.json');
                const data = await response.json();
                document.getElementById('contributor-student-id').textContent = 'Contributor Student ID: ' + data.contributorStudentId;
            } catch (error) {
                document.getElementById('contributor-student-id').textContent = 'Error loading contributor ID.';
            }
        });
    </script>
</body>
</html>
